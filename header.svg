<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Junho Noh - Co-founder at Festi Company">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#131A33"/>
      <stop offset="100%" stop-color="#1B2247"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6EE7F9"/>
      <stop offset="50%" stop-color="#7C8CFF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#7C8CFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7C8CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="200" rx="14" fill="url(#bg)"/>
  <rect width="900" height="200" rx="14" fill="url(#grid)"/>
  <rect width="900" height="200" rx="14" fill="url(#glow)"/>
  <rect x="0" y="0" width="900" height="3" fill="url(#accent)"/>

  <text x="56" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#F2F5FF" letter-spacing="-0.5">노준호<tspan fill="#8FA0C8" font-weight="500" font-size="23" dx="16">Junho Noh</tspan></text>

  <text x="56" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#9FB3FF" letter-spacing="0.2">Co-founder · 페스티컴퍼니</text>

  <text x="56" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8892B0">프론트엔드로 시작해 그 아래 인프라까지 소유합니다</text>

  <text x="56" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#6B779E">축제 · 행사 디지털 전환 솔루션</text>

  <g>
    <circle cx="764" cy="100" r="50" fill="none" stroke="url(#accent)" stroke-opacity="0.30" stroke-width="1.2"/>
    <circle cx="764" cy="100" r="31" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="1.2"/>
    <circle cx="764" cy="100" r="5.5" fill="#7C8CFF"/>
    <circle cx="814" cy="100" r="3.5" fill="#6EE7F9"/>
    <circle cx="764" cy="50" r="3.5" fill="#C084FC"/>
    <circle cx="733" cy="100" r="3" fill="#6EE7F9" fill-opacity="0.75"/>
    <circle cx="786" cy="131" r="3" fill="#C084FC" fill-opacity="0.75"/>
  </g>
</svg>
